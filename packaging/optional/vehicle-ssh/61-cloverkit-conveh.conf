Match User conveh
    ForceCommand /usr/local/bin/conveh-session
    AuthenticationMethods password
    PasswordAuthentication yes
    PubkeyAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    X11Forwarding no
    PermitUserRC no
    PermitTTY yes
    MaxSessions 2
    MaxAuthTries 3
Match all
