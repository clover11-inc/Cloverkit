# Fresh owner configuration; no inherited credentials.
PermitRootLogin no
PasswordAuthentication yes
PermitEmptyPasswords no
AllowUsers admin console conwifi conveh
Match User console
    ForceCommand /usr/local/bin/console
    DisableForwarding yes
    PermitUserRC no
    PermitTTY yes
Match User conwifi
    ForceCommand /usr/bin/python3 /usr/local/lib/bh-interactive/conwifi_report.py
    DisableForwarding yes
    PermitUserRC no
    PermitTTY yes
Match User conveh
    ForceCommand /usr/local/bin/conveh-session
    DisableForwarding yes
    PermitUserRC no
    PermitTTY yes
Match all
